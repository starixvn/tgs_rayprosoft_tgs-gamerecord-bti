variables:
  ImageName: pgtgs/game-gamerecord-bti-service
  TgsSettingKey: game-gamerecord-bti-service
  HelmTemplateFolderName: game-gamerecord-bti-service

  ManualImageName: pgtgs/game-gamerecord-bti-manualservice
  ManualTgsSettingKey: game-gamerecord-bti-manualservice
  ManualHelmTemplateFolderName: game-gamerecord-bti-manualservice

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  stage: build
  script:
    - dotnet build -c $BuildConfiguration
  only:
    - merge_requests
    - main
  artifacts:
    untracked: true
    expire_in: "1 days"

unit-test:
  stage: test
  script:
    - dotnet test -c $BuildConfiguration -l:"junit;LogFilePath=../TestReports/{assembly}-TestReport.xml" --no-restore --no-build
  needs:
    - job: build-code
      artifacts: true
  only:
    - merge_requests
    - main
  artifacts:
    when: always
    reports:
      junit: ./TestReports/*-TestReport.xml

push-docker-image:
  stage: publish
  needs:
    - job: build-code
      artifacts: true
    - unit-test
  only:
    - main
  cache:
    key: Tgs.OpApi.$CI_PIPELINE_ID
    untracked: true
    policy: pull
  script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    - dotnet build "Tgs.GameRecord.BTiService/Tgs.GameRecord.BTiService.csproj" -c $BuildConfiguration -t:ContainerBuild -p:DockerfileTag="$ImageName:$Tag" --no-restore
    - docker push $ImageName:$Tag
    - dotnet build "Tgs.GameRecord.BTiManualService/Tgs.GameRecord.BTiManualService.csproj" -c $BuildConfiguration -t:ContainerBuild -p:DockerfileTag="$ManualImageName:$Tag" --no-restore
    - docker push $ManualImageName:$Tag


push-k8s-template:
  stage: publish
  needs:
    - unit-test
  only:
    - main
  script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    - mkdir -p artifacts/k8s
    - cp -R deployment/k8s/$HelmTemplateFolderName artifacts/k8s/
    - |
      yq -i e '
        .image.repository = strenv(ImageName) |
        .image.tag = strenv(Tag)
      ' artifacts/k8s/$HelmTemplateFolderName/values.yaml
    - cp -R deployment/k8s/$ManualHelmTemplateFolderName artifacts/k8s/
    - |
      yq -i e '
        .image.repository = strenv(ManualImageName) |
        .image.tag = strenv(Tag)
      ' artifacts/k8s/$ManualHelmTemplateFolderName/values.yaml
  artifacts:
    name: HelmTemplate
    untracked: false
    expire_in: "180 days"
    paths:
      - artifacts/**/*

deploy-dev:
  variables:
    GIT_STRATEGY: none
    namespace: dev
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
  before_script:
    - export KUBECONFIG=$KubeConfig_Raypro_dev
  script:
    - export resources=$(kubectl get cm resources-setting -o jsonpath={.data.$TgsSettingKey})
    - export dedicated=$(kubectl get cm tgs-settings -o jsonpath={.data.dedicated})
    - export node_selector=$(kubectl get cm tgs-settings -o jsonpath={.data.node-selector})
    - export autoscaling=$(kubectl get cm autoscaling-setting -o jsonpath={.data.$TgsSettingKey})
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - 
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources,
        "autoscaling": $autoscaling
      }
      EOF
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - \
        | kubectl -n $namespace apply -f -
      {
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources,
        "autoscaling": $autoscaling
      }
      EOF

